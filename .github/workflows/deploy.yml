name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - "ios 2"
      - ios-2
      - ios-3
      - ios-4
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy additional static pages and assets
        run: |
          mkdir -p dist
          # Copy standalone HTML pages if they exist
          for f in audio.html gallery.html preview.html shows.html social.html video.html; do
            if [ -f "$f" ]; then
              cp -v "$f" dist/
            fi
          done
          # Copy asset folders if they exist
          for d in Memes assets; do
            if [ -d "$d" ]; then
              cp -vr "$d" dist/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
